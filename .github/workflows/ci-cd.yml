name: CI/CD Pipeline - Mercado de Flores de Acho

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  test:
    name: 2. Pruebas Automatizadas (pytest)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias y ejecutar tests
        run: |
          pip install -r requirements.txt
          pytest -v

  security:
    name: 3. Seguridad (SAST y Dependencias)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Análisis SAST con Bandit
        run: |
          pip install bandit
          bandit -r main.py
      - name: Análisis de dependencias (SCA) con pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  deploy:
    name: 4. Despliegue a Producción
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar despliegue continuo
        run: echo "Despliegue automático en producción disparado correctamente."